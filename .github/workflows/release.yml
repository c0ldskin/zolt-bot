name: Release

# Push a tag like v0.2.0 to build Zolt for Apple Silicon and Intel and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build universal apps
        run: |
          ./build.sh --release --character zolt
          ./build.sh --release --character zamil
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Zolt $GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" build/Zolt-*.zip build/Zamil-*.zip --clobber
