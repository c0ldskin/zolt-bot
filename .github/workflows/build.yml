name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swiftc --version && sw_vers
      - name: Build Zolt.app
        run: ./build.sh --no-install
      - name: Check the app bundle
        run: |
          test -x build/Zolt.app/Contents/MacOS/Zolt
          test -f build/Zolt.app/Contents/Resources/Zolt.icns
          plutil -lint build/Zolt.app/Contents/Info.plist
